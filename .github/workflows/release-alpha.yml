name: Alpha release bot

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated alpha (false builds and validates only)
        type: boolean
        default: false

permissions:
  contents: read

# Do not cancel or coalesce main updates: each merge gets its own alpha.
defaults:
  run:
    working-directory: core

jobs:
  validation:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/reusable-desktop-validation.yml
    with:
      alpha: true

  publish:
    if: github.event_name == 'push' || inputs.publish == true
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: alpha-release
          path: core/artifacts/alpha-release
      - name: Verify remote assets and publish the complete alpha
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validation.outputs.version }}
        run: node scripts/release-alpha.mjs --publish
