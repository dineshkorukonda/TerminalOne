name: Desktop

on:
  pull_request:
    branches: [main, "refactor/**", "feat/**", "chore/**", "docs/**"]
    # Metadata edits must not cancel a native build already in progress.
    # Draft PRs are tested on opened/synchronize, so ready_for_review adds no work.
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Parallel Windows validation
    uses: ./.github/workflows/reusable-desktop-validation.yml

  quality:
    name: Desktop quality (Windows)
    if: always()
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation lane to succeed
        env:
          VALIDATION_RESULT: ${{ needs.validation.result }}
        run: test "$VALIDATION_RESULT" = success
