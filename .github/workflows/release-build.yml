name: Release artifact build (publishing disabled)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned-artifacts:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      HUSKY: '0'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Validate release build reference
        env:
          BUILD_REF: ${{ github.ref }}
        run: node --input-type=module -e "import {allowedBuildRef} from './scripts/release-notes.mjs'; if(!allowedBuildRef(process.env.BUILD_REF))throw new Error('Release builds require main or a version tag')"
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build:win
      - run: npm run test:installed
      - run: npm run release:notes
      - run: npm audit --audit-level=moderate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terminal-one-unsigned-development
          path: |
            artifacts/windows/*-unsigned-x64.exe
            artifacts/windows/SHA256SUMS.txt
            test-results/installer/
            test-results/release-notes.md
          retention-days: 14
          if-no-files-found: error
