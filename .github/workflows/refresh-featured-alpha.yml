name: Refresh featured alpha

on:
  workflow_run:
    workflows: [Alpha release bot]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: featured-alpha-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Always execute trusted main code, never an upstream PR checkout/artifact.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Verify the published release before replacing featured metadata
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node website/scripts/refresh-alpha.mjs
      - name: Prepare the review PR or a review branch when bot PRs are prohibited
        if: steps.release.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: node website/scripts/open-release-review.mjs
