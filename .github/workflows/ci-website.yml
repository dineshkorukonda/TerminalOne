name: Website

on:
  pull_request:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/ci-website.yml"
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/ci-website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Website quality (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: website/.node-version
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Check Astro and TypeScript
        run: npm run typecheck
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - name: Verify release-data update inputs
        run: npm run test:unit
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build and test production website
        run: npm test
      - name: Preserve failure traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-test-results-${{ matrix.os }}
          path: website/test-results/
          retention-days: 7
