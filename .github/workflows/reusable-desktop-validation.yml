name: Shared desktop validation

on:
  workflow_call:
    inputs:
      alpha:
        type: boolean
        default: false
    outputs:
      version:
        value: ${{ jobs.prepare.outputs.version }}

permissions:
  contents: read

defaults:
  run:
    working-directory: core

jobs:
  static:
    name: Formatting, types and unit tests
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: core/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm audit --audit-level=moderate

  prepare:
    name: Build shared Windows runtime
    runs-on: windows-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: core/package-lock.json
      - run: npm ci
      # Restore/save native outputs under the original lockfile, before stamping.
      - uses: ./.github/actions/windows-native
      - if: inputs.alpha
        run: node scripts/alpha-version.mjs
      - id: version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT
      - run: npm run build
      - run: node scripts/ci-runtime.mjs --write
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-runtime
          path: |
            core/out/
            core/native/pty-job-host.exe
            core/node_modules/node-pty/build/Release/
            core/shell/blesh/
            core/test-results/ci-runtime.json
          include-hidden-files: true
          compression-level: 1
          retention-days: 2
          if-no-files-found: error

  native:
    name: Native sessions and shells
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      HUSKY: "0"
      PTY_PROBE_RESULT: test-results/native/utility.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/windows-runtime
        with:
          alpha: ${{ inputs.alpha }}
      - run: npm run test:native
      - run: npm run test:shells
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: desktop-native-evidence
          path: core/test-results/
          retention-days: 7
          if-no-files-found: ignore

  ui-packaged:
    name: UI and packaged security
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/windows-runtime
        with:
          alpha: ${{ inputs.alpha }}
      # Same suite as test:smoke; its build/install prerequisites ran above.
      - name: Run the desktop smoke suite against the shared build
        run: npx --no-install playwright test
      - run: npm run test:packaged
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: desktop-ui-packaged-evidence
          path: core/test-results/
          retention-days: 7
          if-no-files-found: ignore

  installer:
    name: Installer and installed qualification
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      HUSKY: "0"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/windows-runtime
        with:
          alpha: ${{ inputs.alpha }}
      - run: node scripts/build-win.mjs
      - run: npm run test:installed
      - run: npm run release:notes
      - name: Prepare and validate the release bundle without publishing
        run: node scripts/release-alpha.mjs --prepare
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alpha-release
          path: core/artifacts/alpha-release/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: desktop-installer-evidence
          path: core/test-results/
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: terminal-one-unsigned-installer-windows
          path: |
            core/artifacts/windows/*-unsigned-x64.exe
            core/artifacts/windows/SHA256SUMS.txt
          retention-days: 7
          if-no-files-found: ignore

  performance:
    name: Runtime performance and cleanup
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/windows-runtime
        with:
          alpha: ${{ inputs.alpha }}
      - run: npm run test:profile
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: desktop-performance-evidence
          path: core/test-results/
          retention-days: 7
          if-no-files-found: ignore
